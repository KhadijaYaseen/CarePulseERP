<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarePulse MediCore — Staff Security Portal</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#EFF6FF',
              600: '#2563EB',
              700: '#1D4ED8',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md space-y-6">
    
    <!-- Brand Header -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-brand-600 text-white shadow-md shadow-brand-600/20">
        <i data-lucide="cross" class="w-6 h-6"></i>
      </div>
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">CarePulse MediCore</h1>
      <p class="text-xs text-slate-500 font-medium">Enterprise Hospital ERP &bull; Staff Authentication</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-3xl p-8 border border-slate-200/80 shadow-lg space-y-4">
      
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <span class="text-xs font-bold text-slate-800 uppercase tracking-wider">Clinical Personnel Sign In</span>
        <span class="px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 text-[10px] font-semibold border border-emerald-200 flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Active
        </span>
      </div>

      <form id="admin-login-form" onsubmit="handleLogin(event)" class="space-y-4 text-xs">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Staff Role</label>
          <select id="login-role" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 focus:outline-none focus:border-brand-600">
            <option value="Administrator">👑 Hospital Administrator (Full Control)</option>
            <option value="Doctor">👨‍⚕️ Chief Medical Officer / Physician</option>
            <option value="HeadNurse">🩺 Head Nurse / Ward Incharge</option>
            <option value="PayrollManager">💰 Finance &amp; Payroll Officer</option>
          </select>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">Employee Email / Staff ID</label>
          <input type="email" id="login-email" required value="admin@carepulse.org" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 focus:outline-none focus:border-brand-600">
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">Security Passcode</label>
          <input type="password" id="login-pwd" required value="carepulse2026" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 focus:outline-none focus:border-brand-600">
        </div>

        <button type="submit" class="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs shadow-md shadow-brand-600/20 transition">
          Sign In to Clinical Workspace
        </button>
      </form>

      <div class="pt-2 text-center">
        <a href="index.html" class="text-xs font-semibold text-brand-600 hover:underline flex items-center justify-center gap-1">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
          <span>Direct to Clinical Dashboard</span>
        </a>
      </div>

    </div>

  </div>

  <script>
    lucide.createIcons();
    function handleLogin(e) {
      e.preventDefault();
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
